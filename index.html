  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --error: #dc2626;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      margin-bottom: 2px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.4;
    }

    .sync-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Khung nhập tay & súng bắn mã vạch */
    .manual-gun-box {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .box-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-guide {
      background: #e2e8f0;
      color: #334155;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }
