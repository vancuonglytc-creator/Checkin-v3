<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHÀO MỪNG THÍ SINH - AI-CHALLENGE HCMC2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b1329;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
      --name-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1329 70%, #020617 100%);
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
    }

    .header-section {
      text-align: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(to right, #60a5fa, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.25));
    }

    .main-board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      min-height: 0;
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      min-height: 0;
    }

    .panel-header {
      margin-bottom: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #e2e8f0;
    }

    .panel-left {
      align-items: center;
      justify-content: center;
    }

    .welcome-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      animation: floatIn 0.5s ease-out forwards;
    }

    .welcome-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .welcome-label {
      font-size: 1.1rem;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .val-name {
      font-size: 3rem;
      font-weight: 800;
      background: var(--name-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
    }

    .val-team {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .seat-badge-wrapper {
      margin-top: 4px;
      display: flex;
      justify-content: center;
    }

    .val-seat {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      background: var(--gold-gradient);
      padding: 12px 28px;
      border-radius: 9999px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 1.3rem;
      font-weight: 500;
      gap: 12px;
    }

    .table-container {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
    }

    .table-container::-webkit-scrollbar {
      width: 6px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    th {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      padding: 14px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 14px 10px;
      font-size: 1.1rem;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr.new-row td {
      background: rgba(16, 185, 129, 0.18) !important;
      color: #a7f3d0;
      font-weight: 600;
    }

    tr.new-row td:first-child {
      border-left: 3px solid #10b981;
    }

    .seat-cell {
      font-weight: 700;
      color: #fbbf24;
    }

    .live-status {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(12px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h1 class="page-title">CHÀO MỪNG THÍ SINH</h1>
  </div>

  <div class="main-board">
    
    <!-- CỘT 1: THÍ SINH VỪA ĐIỂM DANH -->
    <div class="panel panel-left">
      <div class="panel
