<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sơ Đồ Bàn Thi & Tiến Độ Check-in AI-CHALLENGE HCMC2026</title>
  <!-- Thư viện đọc CSV Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #1d4ed8;
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      
      --color-full: #16a34a;       /* Đã đủ 100% */
      --color-partial: #d97706;    /* Đang đến một phần */
      --color-none: #334155;       /* Chưa ai đến */
      --color-na: #1e293b;         /* Bàn trống #N/A */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    /* BẢNG ĐIỀU KHIỂN TỔNG QUAN HỘI TRƯỜNG */
    .summary-card {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .val-total { color: #f8fafc; }
    .val-checked { color: #4ade80; }
    .val-missing { color: #f87171; }
    .val-rate { color: #38bdf8; }

    /* KHU VỰC SÂN KHẤU */
    .stage-bar {
      background: linear-gradient(90deg, #0369a1, #0284c7, #0369a1);
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 4px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      margin-top: 4px;
    }

    /* KHUNG SƠ ĐỒ LƯỚI BÀN THI */
    .map-wrapper {
      overflow-x: auto;
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .hall-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(130px, 1fr));
      gap: 10px;
      min-width: 1080px;
    }

    .hall-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-header {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 5px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* CARD TỪNG BÀN THI */
    .desk-card {
      background: #1e293b;
      border: 2px solid var(--color-none);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.25s ease;
      position: relative;
    }

    .desk-card.status-full {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
    }

    .desk-card.status-partial {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
    }

    .desk-card.status-none {
      border-color: #475569;
      opacity: 0.85;
    }

    .desk-card.status-na {
      border-color: #334155;
      background: #0f172a;
      opacity: 0.35;
      justify-content: center;
      align-items: center;
      min-height: 82px;
    }

    .desk-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .desk-pos {
      font-weight: 800;
      font-size: 0.95rem;
      color: #f8fafc;
    }

    .desk-team {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
    }

    .desk-mid {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .desk-badge-count {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .count-checked { color: #4ade80; }
    .count-missing { color: #f87171; }

    /* Chú thích màu sắc */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .live-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseAnim 1.5s infinite;
    }

    @keyframes pulseAnim {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BẢNG TIẾN ĐỘ CHECK-IN THÍ SINH THEO SƠ ĐỒ BÀN</h1>
      <div class="live-status">
        <span><span class="pulse"></span>Tự động cập nhật mỗi 10 giây</span>
        <span id="lastSync">Đang tải dữ liệu...</span>
      </div>
    </header>

    <!-- Ô TỔNG QUAN TIẾN ĐỘ HỘI TRƯỜNG -->
    <div class="summary-card">
      <div class="stat-item">
        <span class="stat-label">Tổng người dự kiến</span>
        <span class="stat-val val-total" id="sumTotal">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Đã Check-in</span>
        <span class="stat-val val-checked" id="sumChecked">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Chưa Check-in</span>
        <span class="stat-val val-missing" id="sumMissing">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Tỷ lệ có mặt</span>
        <span class="stat-val val-rate" id="sumRate">0%</span>
      </div>
    </div>

    <!-- SÂN KHẤU -->
    <div class="stage-bar">S Â N   K H Ấ U</div>

    <!-- BẢN ĐỒ BÀN THI (A ĐẾN H) -->
    <div class="map-wrapper">
      <div class="hall-grid" id="hallGrid">
        <!-- Render động qua JavaScript -->
      </div>
    </div>

    <!-- CHÚ THÍCH TRẠNG THÁI -->
    <div class="legend-bar">
      <div class="legend-item">
        <div class="legend-box" style="border: 2px solid #22c55e; background: rgba(34, 197, 94, 0.2);"></div>
        <span>Đã đến đủ (100%)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="border: 2px solid #f59e0b; background: rgba(245, 158, 11, 0.2);"></div>
        <span>Đến một phần</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="border: 2px solid #475569; background: #1e293b;"></div>
        <span>Chưa ai đến (0%)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background: #0f172a; border: 1px solid #334155;"></div>
        <span>Bàn trống (#N/A)</span>
      </div>
    </div>
  </div>

  <script>
    // ---------------- LINK GOOGLE SHEETS CSV CỦA BẠN ----------------
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4sLZHFDwhiBdhJbQUkIAbNYSsWkx-zxMg6vc4QAMgJu4qW4tsi6vS4PbFys_0Kra681QuCOAQ-RR1/pub?output=csv";

    // CẤU HÌNH SƠ ĐỒ CHUẨN 100% THEO ẢNH BẠN CUNG CẤP
    const HALL_LAYOUT = {
      "A": [
        { pos: "A01", team: "637" }, { pos: "A02", team: "798" }, { pos: "A03", team: "224" },
        { pos: "A04", team: "295" }, { pos: "A05", team: "080" }, { pos: "A06", team: "#N/A" },
        { pos: "A07", team: "317" }, { pos: "A08", team: "574" }, { pos: "A09", team: "360" },
        { pos: "A10", team: "065" }, { pos: "A11", team: "229" }
      ],
      "B": [
        { pos: "B01", team: "293" }, { pos: "B02", team: "821" }, { pos: "B03", team: "119" },
        { pos: "B04", team: "003" }, { pos: "B05", team: "347" }, { pos: "B06", team: "391" },
        { pos: "B07", team: "261" }, { pos: "B08", team: "197" }, { pos: "B09", team: "393" },
        { pos: "B10", team: "639" }, { pos: "B11", team: "297" }
      ],
      "C": [
        { pos: "C01", team: "759" }, { pos: "C02", team: "211" }, { pos: "C03", team: "168" },
        { pos: "C04", team: "584" }, { pos: "C05", team: "134" }, { pos: "C06", team: "282" },
        { pos: "C07", team: "460" }, { pos: "C08", team: "586" }, { pos: "C09", team: "433" },
        { pos: "C10", team: "303" }, { pos: "C11", team: "196" }
      ],
      "D": [
        { pos: "D01", team: "344" }, { pos: "D02", team: "380" }, { pos: "D03", team: "339" },
        { pos: "D04", team: "653" }, { pos: "D05", team: "328" }, { pos: "D06", team: "256" },
        { pos: "D07", team: "291" }, { pos: "D08", team: "348" }, { pos: "D09", team: "138" },
        { pos: "D10", team: "781" }, { pos: "D11", team: "301" }
      ],
      "E": [
        { pos: "E01", team: "504" }, { pos: "E02", team: "609" }, { pos: "E03", team: "486" },
        { pos: "E04", team: "032" }, { pos: "E05", team: "790" }, { pos: "E06", team: "670" },
        { pos: "E07", team: "242" }, { pos: "E08", team: "583" }, { pos: "E09", team: "761" },
        { pos: "E10", team: "218" }
      ],
      "F": [
        { pos: "F01", team: "813" }, { pos: "F02", team: "420" }, { pos: "F03", team: "251" },
        { pos: "F04", team: "593" }, { pos: "F05", team: "326" }, { pos: "F06", team: "343" },
        { pos: "F07", team: "468" }, { pos: "F08", team: "594" }, { pos: "F09", team: "631" },
        { pos: "F10", team: "101" }
      ],
      "G": [
        { pos: "G01", team: "589" }, { pos: "G02", team: "226" }, { pos: "G03", team: "636" },
        { pos: "G04", team: "528" }, { pos: "G05", team: "803" }, { pos: "G06", team: "352" },
        { pos: "G07", team: "804" }, { pos: "G08", team: "400" }, { pos: "G09", team: "728" },
        { pos: "G10", team: "456" }
      ],
      "H": [
        { pos: "H01", team: "044" }, { pos: "H02", team: "722" }, { pos: "H03", team: "135" },
        { pos: "H04", team: "430" }, { pos: "H05", team: "774" }, { pos: "H06", team: "#N/A" },
        { pos: "H07", team: "664" }, { pos: "H08", team: "438" }, { pos: "H09", team: "713" },
        { pos: "H10", team: "817" }
      ]
    };

    // Chuẩn hóa mã số (bỏ số 0 thừa nếu có để so khớp chính xác: ví dụ 065 khớp với 65 hoặc 065)
    function cleanCode(str) {
      if (!str) return "";
      str = str.toString().trim().toLowerCase();
      // Bỏ số 0 ở đầu nếu toàn số (ví dụ '044' -> '44') để tránh lệch format giữa sheet và sơ đồ
      if (/^\d+$/.test(str)) {
        return parseInt(str, 10).toString();
      }
      return str;
    }

    async function updateDashboard() {
      if (!SHEET_CSV_URL) return;

      const urlWithCacheBuster = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now();

      Papa.parse(urlWithCacheBuster, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          // Gom nhóm thí sinh theo Vị Trí hoặc Đội Thi
          // Map: key -> { total: 0, checked: 0 }
          const teamStats = new Map();
          const posStats = new Map();

          let totalCandidates = 0;
          let totalChecked = 0;

          results.data.forEach(row => {
            const id = (row['Mã số'] || row['ID'] || '').trim();
            if (!id) return;

            const pos = (row['Vị trí'] || row['ViTri'] || '').trim().toUpperCase();
            const team = (row['Đội thi'] || row['PhongThi'] || row['Phòng thi'] || '').trim();
            const status = (row['Trạng thái'] || '').trim();
            const isChecked = (status === "Đã checkin" || status === "Đã điểm danh" || (row['Thời gian checkin'] || '').trim() !== "");

            totalCandidates++;
            if (isChecked) totalChecked++;

            // Thống kê theo Vị trí bàn (A01, B02...)
            if (pos) {
              if (!posStats.has(pos)) posStats.set(pos, { total: 0, checked: 0 });
              const p = posStats.get(pos);
              p.total++;
              if (isChecked) p.checked++;
            }

            // Thống kê theo Mã đội (044, 637...)
            if (team) {
              const cTeam = cleanCode(team);
              if (!teamStats.has(cTeam)) teamStats.set(cTeam, { total: 0, checked: 0 });
              const t = teamStats.get(cTeam);
              t.total++;
              if (isChecked) t.checked++;
            }
          });

          // CẬP NHẬT 4 Ô TỔNG QUAN
          const totalMissing = totalCandidates - totalChecked;
          const rate = totalCandidates > 0 ? Math.round((totalChecked / totalCandidates) * 100) : 0;

          document.getElementById("sumTotal").textContent = totalCandidates;
          document.getElementById("sumChecked").textContent = totalChecked;
          document.getElementById("sumMissing").textContent = totalMissing;
          document.getElementById("sumRate").textContent = rate + "%";

          const now = new Date();
          document.getElementById("lastSync").textContent = "Cập nhật lúc: " + now.toLocaleTimeString('vi-VN');

          // RENDER SƠ ĐỒ LƯỚI HỘI TRƯỜNG
          renderHallMap(posStats, teamStats);
        },
        error: function(err) {
          console.error("Lỗi tải Sheet:", err);
          document.getElementById("lastSync").textContent = "Lỗi nạp dữ liệu!";
        }
      });
    }

    function renderHallMap(posStats, teamStats) {
      const hallContainer = document.getElementById("hallGrid");
      hallContainer.innerHTML = "";

      // Duyệt qua 8 cột dãy: A, B, C, D, E, F, G, H
      for (const colKey of Object.keys(HALL_LAYOUT)) {
        const colDiv = document.createElement("div");
        colDiv.className = "hall-col";

        // Tiêu đề dãy bàn
        const colHeader = document.createElement("div");
        colHeader.className = "col-header";
        colHeader.textContent = `DÃY ${colKey}`;
        colDiv.appendChild(colHeader);

        // Duyệt danh sách bàn trong dãy
        HALL_LAYOUT[colKey].forEach(desk => {
          const deskCard = document.createElement("div");

          if (desk.team === "#N/A") {
            // Bàn trống không sử dụng
            deskCard.className = "desk-card status-na";
            deskCard.innerHTML = `
              <div style="font-weight:700; color:#64748b;">${desk.pos}</div>
              <div style="font-size:0.75rem; color:#475569;">#N/A</div>
            `;
          } else {
            // Lấy thông tin check-in: ưu tiên tra theo Mã Vị Trí, nếu chưa có thì tra theo Mã Đội
            const cTeam = cleanCode(desk.team);
            const stat = posStats.get(desk.pos) || teamStats.get(cTeam) || { total: 0, checked: 0 };
            
            const total = stat.total;
            const checked = stat.checked;
            const missing = Math.max(0, total - checked);

            // Xác định trạng thái màu sắc
            let statusClass = "status-none";
            if (total > 0) {
              if (checked === total) statusClass = "status-full";
              else if (checked > 0) statusClass = "status-partial";
            }

            deskCard.className = `desk-card ${statusClass}`;
            deskCard.innerHTML = `
              <div class="desk-top">
                <span class="desk-pos">${desk.pos}</span>
                <span class="desk-team">${desk.team}</span>
              </div>
              <div class="desk-mid">
                <span class="desk-badge-count">Tổng: <b>${total}</b></span>
                <span class="desk-badge-count">
                  <span class="count-checked">✓${checked}</span> / <span class="count-missing">-${missing}</span>
                </span>
              </div>
            `;
          }

          colDiv.appendChild(deskCard);
        });

        hallContainer.appendChild(colDiv);
      }
    }

    // Khởi chạy ngay và tự động lặp lại mỗi 10 giây
    window.addEventListener("DOMContentLoaded", () => {
      updateDashboard();
      setInterval(updateDashboard, 10000);
    });
  </script>
</body>
</html>
