<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SƠ ĐỒ CHECK-IN BÀN THI - AI-CHALLENGE HCMC2026</title>
  <style>
    :root {
      --bg: #0b1329;
      --panel-bg: #152238;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #24344d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .summary-card {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .val-total { color: #f8fafc; }
    .val-checked { color: #4ade80; }
    .val-missing { color: #f87171; }
    .val-rate { color: #38bdf8; }

    .stage-bar {
      background: linear-gradient(90deg, #0284c7, #38bdf8, #0284c7);
      color: #0b1329;
      text-align: center;
      padding: 9px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 6px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .map-wrapper {
      overflow-x: auto;
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid var(--border);
    }

    .hall-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(130px, 1fr));
      gap: 9px;
      min-width: 1080px;
    }

    .hall-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-header {
      background: #0369a1;
      color: #fff;
      font-weight: 700;
      text-align: center;
      padding: 5px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .desk-card {
      background: #1e293b;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.3s ease;
    }

    .desk-card.status-full {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.16);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }

    .desk-card.status-partial {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.16);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }

    .desk-card.status-none {
      border-color: #334155;
      opacity: 0.8;
    }

    .desk-card.status-na {
      border-color: #1e293b;
      background: #0b1329;
      opacity: 0.3;
      justify-content: center;
      align-items: center;
      min-height: 72px;
    }

    .desk-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .desk-pos {
      font-weight: 800;
      font-size: 0.95rem;
      color: #f8fafc;
    }

    .desk-team {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
    }

    .desk-mid {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      margin-top: 2px;
    }

    .desk-badge-count {
      background: #111c30;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
    }

    .count-checked { color: #4ade80; }
    .count-missing { color: #f87171; }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .live-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      width: 100%;
    }

    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseAnim 1.2s infinite;
    }

    @keyframes pulseAnim {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

      </div>
    </div>
  </div>
