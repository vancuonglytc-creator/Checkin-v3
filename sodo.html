<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHÀO MỪNG THÍ SINH - AI-CHALLENGE HCMC2026</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --seat-color: #b45309;
      --bg: #f8fafc;
      --border-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", Times, serif, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    /* TIÊU ĐỀ CHÍNH */
    .page-title {
      text-align: center;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* KHUNG BỐ CỤC CHÍNH CHIA ĐÔI */
    .main-board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 2px solid var(--border-color);
      background: #fff;
      min-height: 75vh;
    }

    /* CỘT TRÁI: THÍ SINH VỪA ĐIỂM DANH */
    .panel-left {
      border-right: 2px solid var(--border-color);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel-title {
      font-size: 1.85rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 50px;
    }

    .welcome-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 30px;
      text-align: center;
      animation: fadeInZoom 0.5s ease-out;
    }

    .welcome-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .welcome-label {
      font-size: 1.3rem;
      color: #475569;
      font-weight: 600;
    }

    .val-name {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      line-height: 1.2;
    }

    .val-team {
      font-size: 2.1rem;
      font-weight: 700;
      color: #1e293b;
    }

    .val-seat {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--seat-color);
      background: #fef3c7;
      padding: 10px 24px;
      border-radius: 12px;
      border: 2px solid #fde68a;
      display: inline-block;
    }

    .empty-state {
      font-size: 1.5rem;
      color: #94a3b8;
      font-style: italic;
      margin-top: 100px;
    }

    /* CỘT PHẢI: BẢNG DANH SÁCH ĐÃ ĐIỂM DANH */
    .panel-right {
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
    }

    .table-container {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      max-height: 68vh;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 1.15rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 12px 8px;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 800;
      font-size: 1.2rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* Hàng mới nhất vừa check-in */
    tr.new-row {
      background-color: #dcfce7 !important;
      font-weight: 700;
      animation: highlightRow 1.5s ease-out;
    }

    .seat-cell {
      font-weight: 700;
      color: var(--seat-color);
    }

    @keyframes fadeInZoom {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes highlightRow {
      0% { background-color: #86efac; }
      100% { background-color: #dcfce7; }
    }

    /* THANH TRẠNG THÁI REALTIME */
    .live-indicator {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.95rem;
      color: #475569;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #16a34a;
      border-radius: 50%;
      box-shadow: 0 0 10px #16a34a;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- TIÊU ĐỀ TRÊN CÙNG -->
  <div class="page-title">CHÀO MỪNG THÍ SINH</div>

  <!-- BẢNG ĐIỀU KHIỂN CHÍNH -->
  <div class="main-board">
    
    <!-- CỘT 1: THÍ SINH VỪA ĐIỂM DANH -->
    <div class="panel-left">
      <div class="panel-title">THÍ SINH VỪA ĐIỂM DANH</div>

      <div id="welcomeContent" class="welcome-card" style="display: none;">
        <div class="welcome-item">
          <span class="welcome-label">Họ và tên</span>
          <div class="val-name" id="viewName">--</div>
        </div>

        <div class="welcome-item">
          <span class="welcome-label">Đội thi</span>
          <div class="val-team" id="viewTeam">--</div>
        </div>

        <div class="welcome-item">
          <span class="welcome-label">Vị trí chỗ ngồi</span>
          <div>
            <span class="val-seat" id="viewSeat">--</span>
          </div>
        </div>
      </div>

      <div id="welcomeEmpty" class="empty-state">
        Đang chờ thí sinh điểm danh...
      </div>
    </div>

    <!-- CỘT 2: DANH SÁCH ĐÃ ĐIỂM DANH -->
    <div class="panel-right">
      <div class="panel-title">DANH SÁCH THÍ SINH ĐÃ ĐIỂM DANH</div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 15%;">Mã số</th>
              <th style="width: 32%;">Họ và tên</th>
              <th style="width: 25%;">Đội thi</th>
              <th style="width: 28%;">Vị trí chỗ ngồi</th>
            </tr>
          </thead>
          <tbody id="checkedTableBody">
            <!-- Dữ liệu render động -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="live-indicator">
    <div class="dot"></div>
    <span id="syncText">Hệ thống Realtime đang kết nối...</span>
  </div>

  <script>
    // ---------------- LIÊN KẾT GOOGLE APPS SCRIPT ĐÃ TRIỂN KHAI ----------------
    const CHECKIN_API_URL = "https://script.google.com/macros/s/AKfycbwyysUeK3wwmAqsiYKZQkE_PquC_NQBSvvjarmef_SJVgip5OYuLdAM3lMst2v9HpB5/exec";

    // Định dạng Chỗ ngồi chuẩn: Dãy ... Hàng ... Ghế ...
    function formatSeat(day, hang, ghe) {
      let parts = [];
      if (day && day !== "--") parts.push(`Dãy ${day}`);
      if (hang && hang !== "--") parts.push(`Hàng ${hang}`);
      if (ghe && ghe !== "--") parts.push(`Ghế ${ghe}`);
      return parts.length > 0 ? parts.join(" ") : "--";
    }

    // JSONP chống chặn CORS trên trình duyệt
    function fetchWithJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_welcome_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName + '&t=' + Date.now();

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("Lỗi kết nối JSONP"));
        };

        function cleanup() {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        document.body.appendChild(script);
      });
    }

    // Quản lý trạng thái
    let knownCheckedIds = new Set();
    let displayQueue = [];      // Hàng đợi hiển thị bên trái (mỗi người 5 giây)
    let isShowingQueue = false;
    let isInitialLoad = true;
    let fullCheckedList = [];   // Danh sách thí sinh đã check-in cho bảng bên phải

    // 1. TẢI DỮ LIỆU TỪ SHEETS LIÊN TỤC
    async function syncData() {
      try {
        let rows = null;
        try {
          rows = await fetchWithJsonp(`${CHECKIN_API_URL}?action=getData`);
        } catch (e) {
          const res = await fetch(`${CHECKIN_API_URL}?action=getData&t=${Date.now()}`);
          rows = await res.json();
        }

        if (Array.isArray(rows)) {
          // Lọc ra các thí sinh đã check-in
          const checkedCandidates = rows.filter(r => 
            r.status === "Đã checkin" || r.status === "Đã điểm danh" || (r.time && r.time.trim() !== "")
          );

          // Phát hiện thí sinh mới điểm danh
          checkedCandidates.forEach(candidate => {
            const id = candidate.id.toString().trim().toLowerCase();
            if (!knownCheckedIds.has(id)) {
              knownCheckedIds.add(id);

              const formattedCandidate = {
                id: candidate.id,
                name: candidate.name,
                team: candidate.team,
                seat: formatSeat(candidate.day, candidate.hang, candidate.ghe),
                time: candidate.time || ""
              };

              // Đưa vào đầu danh sách bảng bên phải
              fullCheckedList.unshift(formattedCandidate);

              // Đưa vào hàng đợi chào mừng bên trái
              displayQueue.push(formattedCandidate);
            }
          });

          // Cập nhật bảng bên phải
          renderRightTable();

          // Kích hoạt luồng chiếu nếu hàng đợi có người
          if (displayQueue.length > 0 && !isShowingQueue) {
            processDisplayQueue();
          }

          document.getElementById("syncText").textContent = `Cập nhật: ${new Date().toLocaleTimeString('vi-VN')} (${fullCheckedList.length} thí sinh)`;
        }
      } catch (err) {
        console.error("Lỗi đồng bộ:", err);
      }
    }

    // 2. VÒNG LẶP HÀNG ĐỢI: HIỂN THỊ MỖI THÍ SINH TRONG 5 GIÂY
    function processDisplayQueue() {
      if (displayQueue.length === 0) {
        isShowingQueue = false;
        return;
      }

      isShowingQueue = true;
      const current = displayQueue.shift(); // Lấy thí sinh tiếp theo

      // Hiển thị thông tin lên cột trái
      const contentBox = document.getElementById("welcomeContent");
      const emptyBox = document.getElementById("welcomeEmpty");

      emptyBox.style.display = "none";
      contentBox.style.display = "flex";

      // Kích hoạt lại animation
      contentBox.style.animation = "none";
      void contentBox.offsetWidth; // trigger reflow
      contentBox.style.animation = "fadeInZoom 0.5s ease-out";

      document.getElementById("viewName").textContent = current.name || "--";
      document.getElementById("viewTeam").textContent = current.team || "--";
      document.getElementById("viewSeat").textContent = current.seat || "--";

      // Đợi đúng 5 giây trước khi chuyển người kế tiếp
      setTimeout(() => {
        processDisplayQueue();
      }, 5000);
    }

    // 3. RENDER BẢNG BÊN PHẢI (NGƯỜI MỚI NHẤT TRÊN CÙNG)
    function renderRightTable() {
      const tbody = document.getElementById("checkedTableBody");
      tbody.innerHTML = "";

      fullCheckedList.forEach((c, index) => {
        const tr = document.createElement("tr");
        if (index === 0) tr.className = "new-row";

        tr.innerHTML = `
          <td><b>${c.id}</b></td>
          <td style="text-align: left; padding-left: 14px;">${c.name}</td>
          <td>${c.team}</td>
          <td class="seat-cell">${c.seat}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Khởi chạy ngay và quét Realtime mỗi 2.5 giây
    window.addEventListener("DOMContentLoaded", () => {
      syncData();
      setInterval(syncData, 2500);
    });
  </script>
</body>
</html>
