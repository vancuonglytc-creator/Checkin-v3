<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHÀO MỪNG THÍ SINH - AI-CHALLENGE HCMC2026</title>
  <!-- Google Fonts: Phông chữ hiện đại, mềm mại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      
      --accent-glow: #38bdf8;
      --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
      --name-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --success-gradient: linear-gradient(135deg, #10b981, #059669);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 36px;
      overflow-x: hidden;
    }

    /* TIÊU ĐỀ TRANG */
    .header-section {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(to right, #60a5fa, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.25));
    }

    /* BỐ CỤC KHUNG CHÍNH CHIA ĐÔI */
    .main-board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      min-height: 75vh;
    }

    /* CARD DẠNG KÍNH MỜ (GLASSMORPHISM) */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* VIỀN ÁNH SÁNG TRANG TRÍ */
    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .panel-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #e2e8f0;
      text-align: center;
    }

    /* CỘT TRÁI: THÍ SINH VỪA ĐIỂM DANH */
    .panel-left {
      align-items: center;
      justify-content: flex-start;
    }

    .welcome-card {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      text-align: center;
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .welcome-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .welcome-label {
      font-size: 1.15rem;
      color: var(--text-sub);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .val-name {
      font-size: 3.2rem;
      font-weight: 800;
      background: var(--name-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
      filter: drop-shadow(0 4px 20px rgba(96, 165, 250, 0.3));
    }

    .val-team {
      font-size: 2.1rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.5px;
    }

    /* KHỐI VỊ TRÍ CHỖ NGỒI NỔI BẬT */
    .seat-badge-wrapper {
      margin-top: 4px;
      display: flex;
      justify-content: center;
    }

    .val-seat {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      background: var(--gold-gradient);
      padding: 14px 32px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 1.35rem;
      font-weight: 500;
      gap: 16px;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      opacity: 0.4;
    }

    /* CỘT PHẢI: BẢNG DANH SÁCH */
    .table-container {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      max-height: 62vh;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
    }

    /* THANH CUỘN MỀM MẠI */
    .table-container::-webkit-scrollbar {
      width: 6px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: center;
    }

      background: rgba(15, 23, 4
